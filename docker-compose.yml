services:
  muninn:
    build: .
    container_name: muninn
    stdin_open: true
    tty: true
    volumes:
      - ./.env:/app/.env:ro
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:rw
    restart: unless-stopped

  huginn:
    build: .
    container_name: huginn
    command: python cli.py huginn server
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:rw
      - ./logs:/app/logs
      - ./huginn_sessions:/app/huginn_sessions
    environment:
      - DISPLAY=:99
      - PYTHONUTF8=1
    restart: unless-stopped
    depends_on:
      - muninn
